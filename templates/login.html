<!DOCTYPE html>
<html>
<head>
    <title>GROOM AI Login</title>
</head>

<body style="
    background:#07101f;
    color:white;
    font-family:Arial;
    text-align:center;
    padding-top:100px;
">

    <h1>✦ GROOM AI</h1>

    <h2>Login</h2>

    {% if error %}
        <p style="color:#ff6b7a;">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
            style="display:block;margin:15px auto;padding:12px;"
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
            style="display:block;margin:15px auto;padding:12px;"
        >

        <button
            type="submit"
            style="padding:12px 30px;"
        >
            Sign In
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="/signup" style="color:#00e5ff;">
            Sign Up
        </a>
    </p>

</body>
</html>
