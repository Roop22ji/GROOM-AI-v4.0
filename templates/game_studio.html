<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GROOM Game Studio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .studio-page {
            min-height: 100vh;
            padding: 28px 18px 60px;
            position: relative;
            overflow: hidden;
        }
        .studio-wrap {
            width: min(920px, 100%);
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }
        .studio-top {
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            margin-bottom:28px;
        }
        .studio-back {
            border:1px solid rgba(0,220,255,.16);
            background:rgba(7,15,30,.7);
            color:#dffaff;
            border-radius:12px;
            padding:10px 14px;
            cursor:pointer;
        }
        .studio-badge {
            color:#00dfff;
            font-size:11px;
            letter-spacing:1.5px;
            text-transform:uppercase;
        }
        .studio-hero {
            text-align:center;
            padding:34px 18px 24px;
        }
        .studio-orb {
            width:76px;height:76px;border-radius:24px;
            margin:0 auto 18px;
            display:grid;place-items:center;
            font-size:34px;color:#00e5ff;
            background:linear-gradient(135deg,rgba(0,220,255,.14),rgba(65,105,255,.18));
            border:1px solid rgba(0,220,255,.25);
            box-shadow:0 0 45px rgba(0,200,255,.12);
        }
        .studio-hero h1 {
            margin:0;
            font-size:clamp(30px,6vw,52px);
            letter-spacing:-1.5px;
        }
        .studio-hero h1 span { color:#00dfff; }
        .studio-hero p {
            color:#7587a4;
            max-width:600px;
            margin:12px auto 0;
        }
        .studio-card {
            margin-top:22px;
            padding:22px;
            border-radius:24px;
            background:rgba(8,17,34,.82);
            border:1px solid rgba(0,210,255,.13);
            box-shadow:0 25px 70px rgba(0,0,0,.3);
            backdrop-filter:blur(18px);
        }
        .studio-input {
            display:flex;
            gap:10px;
            padding:8px;
            border-radius:16px;
            background:rgba(2,8,20,.8);
            border:1px solid rgba(120,160,210,.12);
        }
        .studio-input input {
            flex:1;
            min-width:0;
            border:0;
            outline:0;
            background:transparent;
            color:white;
            padding:12px;
            font-size:15px;
        }
        .studio-input button {
            border:0;
            border-radius:12px;
            padding:0 20px;
            font-weight:700;
            color:white;
            background:linear-gradient(135deg,#00bfff,#4169ff);
            cursor:pointer;
        }
        .studio-input button:disabled { opacity:.55; cursor:wait; }
        .studio-examples {
            display:flex;
            flex-wrap:wrap;
            gap:9px;
            margin-top:14px;
        }
        .studio-examples button {
            border:1px solid rgba(0,210,255,.12);
            background:rgba(0,210,255,.035);
            color:#a8c1dc;
            padding:9px 12px;
            border-radius:11px;
            cursor:pointer;
        }
        .studio-status {
            display:none;
            margin-top:16px;
            padding:14px;
            border-radius:13px;
            background:rgba(0,210,255,.05);
            border:1px solid rgba(0,210,255,.1);
            color:#9dc9e2;
            font-size:13px;
        }
        .studio-status.error {
            color:#ff9aa7;
            border-color:rgba(255,80,100,.18);
            background:rgba(255,80,100,.05);
        }
        .studio-open {
            display:inline-block;
            margin-top:10px;
            color:#00e5ff;
            text-decoration:none;
            font-weight:700;
        }
        .studio-note {
            text-align:center;
            margin-top:18px;
            color:#50617a;
            font-size:11px;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="aurora">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>
    </div>

    <main class="studio-page">
        <div class="studio-wrap">

            <div class="studio-top">
                <button class="studio-back" onclick="location.href='/'">← Back to GROOM AI</button>
                <div class="studio-badge">✦ GROOM GAME STUDIO</div>
            </div>

            <section class="studio-hero">
                <div class="studio-orb">◆</div>
                <h1>Build games <span>with AI</span></h1>
                <p>Describe a game idea and Groom Game Engine will create a playable browser game.</p>
            </section>

            <section class="studio-card">
                <form id="gameForm" class="studio-input">
                    <input id="gameDescription"
                           autocomplete="off"
                           placeholder="e.g. Make a 3D endless runner game"
                           required>
                    <button id="createGame" type="submit">Create Game ✦</button>
                </form>

                <div class="studio-examples">
                    <button type="button" data-prompt="Make a 3D endless runner game">🏃 Endless Runner</button>
                    <button type="button" data-prompt="Make a Temple Run style game">🏛️ Temple Run</button>
                </div>

                <div id="studioStatus" class="studio-status"></div>
            </section>

            <div class="studio-note">
                Current engine build: 3D endless runner / Temple Run-style prototype.
            </div>
        </div>
    </main>
</div>

<script>
const form = document.getElementById("gameForm");
const input = document.getElementById("gameDescription");
const button = document.getElementById("createGame");
const statusBox = document.getElementById("studioStatus");

document.querySelectorAll("[data-prompt]").forEach(btn => {
    btn.addEventListener("click", () => {
        input.value = btn.dataset.prompt;
        input.focus();
    });
});

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const description = input.value.trim();
    if (!description) return;

    button.disabled = true;
    button.textContent = "Creating...";
    statusBox.className = "studio-status";
    statusBox.style.display = "block";
    statusBox.textContent = "GROOM is creating your game...";

    try {
        const response = await fetch("/api/game/create", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({description})
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
            throw new Error(data.error || "Game creation failed.");
        }

        statusBox.innerHTML =
            "✓ Game created successfully." +
            '<br><a class="studio-open" href="' + data.game_url + '">▶ Play Game</a>';

        // Open the generated game automatically.
        window.open(data.game_url, "_blank");

    } catch (error) {
        statusBox.className = "studio-status error";
        statusBox.textContent = "⚠️ " + error.message;
    } finally {
        button.disabled = false;
        button.textContent = "Create Game ✦";
    }
});
</script>
</body>
</html>
