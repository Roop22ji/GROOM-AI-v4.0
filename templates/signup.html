<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up — GROOM AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='auth.css') }}">
</head>

<body>

<div class="auth-page">

    <div class="auth-glow glow-one"></div>
    <div class="auth-glow glow-two"></div>

    <div class="auth-card">

        <div class="auth-logo">
            ✦
        </div>

        <h1>Create your account</h1>

        <p class="subtitle">
            Start your journey with GROOM AI
        </p>


        {% if error %}
        <div class="auth-error">
            {{ error }}
        </div>
        {% endif %}


        <form method="POST">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Choose a username"
                required
            >


            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="you@example.com"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >


            <label>Confirm password</label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm your password"
                required
            >


            <button class="auth-button" type="submit">
                Create Account
                <span>→</span>
            </button>

        </form>


        <div class="auth-divider">
            <span>Already have an account?</span>
        </div>


        <a href="/login" class="secondary-button">
            Sign In
        </a>


        <div class="auth-footer">
            ✦ GROOM AI
        </div>

    </div>

</div>

</body>
</html>
