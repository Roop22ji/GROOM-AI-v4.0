<!doctype html>
<html>
<head><meta charset="utf-8"><title>Groom Game Engine Test</title></head>
<body>
<h2>Groom Game Engine</h2>
<button id="create">Create Temple Run Game</button>
<p id="status"></p>
<script>
document.getElementById("create").onclick = async () => {
  const status = document.getElementById("status");
  status.textContent = "Creating game...";
  try {
    const r = await fetch("/api/game/create", {method:"POST"});
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || "Game creation failed");
    status.innerHTML = '<a target="_blank" href="' + data.game_url + '">Open generated game</a>';
  } catch (e) {
    status.textContent = "Error: " + e.message;
  }
};
</script>
</body>
</html>
